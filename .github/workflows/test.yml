name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Tests
        run: node --test "src/**/*.test.ts"
      - name: Typecheck
        run: |
          npm install --no-save --no-package-lock typescript@5.9.3 @types/node@24.13.6
          npx tsc -p tsconfig.json
